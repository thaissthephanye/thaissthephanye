name: Atualizar cobrinha das contribuições

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Abrir código do perfil
        uses: actions/checkout@v4

      - name: Gerar SVGs animados em rosa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_snake.py

      - name: Abrir branch de imagens existente
        uses: actions/checkout@v4
        with:
          ref: output
          path: output

      - name: Atualizar somente os SVGs da cobrinha
        shell: bash
        run: |
          cp dist/*.svg output/
          cd output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg github-stats.svg github-languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza animação das contribuições"
            git push origin HEAD:output
          fi
